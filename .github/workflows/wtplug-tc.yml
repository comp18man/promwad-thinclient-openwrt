name: wtplug-tc release

on:
  push:
    tags:
      - 'wtplug-tc-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Build
        run: ./wtplug-tc-build.sh

      - name: Collect images
        run: |
          d=bin/targets/kirkwood/generic
          mkdir out
          cp $d/*-promwad_wtplug-tc-initramfs-uImage \
            $d/*-promwad_wtplug-tc-squashfs-sysupgrade.bin out/
          cp $d/u-boot-wtplug_tc/u-boot.kwb out/u-boot-wtplug_tc.kwb
          cd out && sha256sum * > sha256sums

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: out/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          notes=
          if [ "${ref% *}" = tag ]; then
            notes=$(gh api "repos/$GH_REPO/git/tags/${ref#* }" --jq .message)
          fi
          gh release create "$TAG" --verify-tag --notes "$notes" out/*
